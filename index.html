<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi clóset">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icono.png">
<title>Mi clóset</title>
<style>
/* ============================================================
   TOKENS
   El fondo es neutro a propósito: los colores de las prendas
   se juzgan mejor sobre gris que sobre un fondo teñido.
   --accent sale de tu paleta (Perfil → Color de la app).
   ============================================================ */
:root{
  --bg:#F2F2EF; --surface:#FFFFFF; --ink:#1C1E20; --ink2:#5A5E63; --ink3:#8B8E92; --line:#DEDEDA;
  --fill:rgba(118,118,128,.12); --ring:#1C1E20; --swline:rgba(0,0,0,.12);
  --accent:#1F5560; --accent-claro:#8FB4BC; --tinta-accent:var(--accent);
  --si:#556B2F; --ojo:#8E3B2F;
  --redonda:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tabs:54px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#17181A;--surface:#212326;--ink:#EDEDEA;--ink2:#A3A6A9;--ink3:#74777B;--line:#33363A;
    --fill:rgba(118,118,128,.24);--ring:#EDEDEA;--swline:rgba(255,255,255,.16);--tinta-accent:var(--accent-claro);--si:#9DB56F;--ojo:#E08A7C;}
}
:root[data-theme="dark"]{--bg:#17181A;--surface:#212326;--ink:#EDEDEA;--ink2:#A3A6A9;--ink3:#74777B;--line:#33363A;
  --fill:rgba(118,118,128,.24);--ring:#EDEDEA;--swline:rgba(255,255,255,.16);--tinta-accent:var(--accent-claro);--si:#9DB56F;--ojo:#E08A7C;}

*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tinta-accent);outline-offset:3px;border-radius:12px}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 18px calc(var(--tabs) + env(safe-area-inset-bottom,0px) + 104px)}

/* Encabezado de pantalla */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px}
.titulo{font:700 30px/1.1 var(--redonda);letter-spacing:-.02em}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 11px;border-radius:20px;background:var(--fill);
  font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sync svg{width:16px;height:16px}
.sync[data-estado="cargando"] svg,.sync[data-estado="enviando"] svg{animation:giro .9s linear infinite}
.sync[data-estado="pendiente"]{color:var(--ojo)}
@keyframes giro{to{transform:rotate(360deg)}}

/* Control segmentado */
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:2px;border-radius:11px;background:var(--fill)}
.seg2 button{min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* Progreso = resumen del outfit */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:10px;
  display:grid;grid-template-columns:repeat(var(--n,6),1fr);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.segm{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:52px;padding:2px 0}
.dot{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--ink3);position:relative;overflow:hidden}
.segm.done .dot{border:0;box-shadow:inset 0 0 0 1px var(--swline)}
.segm.now .dot{border:2px solid var(--ring)}
.segm.done.now .dot{border:0;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}
.dot i{position:absolute;inset:0 0 0 50%}
.segm span:last-child{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.segm.now span:last-child{color:var(--ink);font-weight:650}
.segm.skip .dot{border-style:solid;opacity:.5}
.segm.skip .dot::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:1.5px;background:var(--ink2)}
.dot.none,.c.none{border:1.5px dashed var(--ink2)!important;background:transparent!important}

/* Paso del configurador */
.step{padding-top:24px}
.q{font:700 24px/1.15 var(--redonda);letter-spacing:-.02em}
.count{margin-top:8px;font-size:15px;color:var(--ink2)}
.count b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:14px;font-weight:550;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .pt{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--swline)}
.grid{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:18px 14px;margin-top:22px}
.opt{display:block;width:100%;text-align:left;border-radius:16px}
.sw{display:block;height:76px;border-radius:14px;box-shadow:inset 0 0 0 1px var(--swline);position:relative;overflow:hidden;transition:transform .12s}
.opt:active .sw{transform:scale(.97)}
.sw i{position:absolute;top:0;right:0;bottom:0;width:38%}
.sw.none{background:transparent!important;box-shadow:none;border:1.5px dashed var(--ink2)}
.opt.sel .sw{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ring)}
.nm{display:block;margin-top:9px;font-size:15px;font-weight:600;line-height:1.25}
.nm small{font-size:12px;color:var(--tinta-accent);margin-left:4px}
.hx{display:block;margin-top:2px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.opt.off{cursor:not-allowed;opacity:.4}
.opt.off .sw::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--bg) calc(50% - 1px),var(--bg) calc(50% + 1px),transparent calc(50% + 1px))}
.opt.off .nm{font-weight:500}

/* Resultado */
.done-wrap{padding-top:24px}
.result{display:grid;grid-template-columns:132px 1fr;gap:26px;align-items:start;margin-top:20px}
.fig{display:flex;flex-direction:column;align-items:center;width:132px}
.fig svg{width:58px;height:22px;margin-bottom:8px}
.f-top{width:120px;height:104px;border-radius:30px 30px 8px 8px;display:flex;overflow:hidden;box-shadow:inset 0 0 0 1px var(--swline);position:relative}
.f-top .ly{width:26%}.f-top .tp{flex:1}
.f-top .w{position:absolute;right:6px;bottom:12px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.18)}
.f-belt{width:112px;height:10px;box-shadow:inset 0 0 0 1px var(--swline)}
.f-pant{width:112px;height:128px;display:flex;gap:6px}
.f-pant i{flex:1;border-radius:0 0 6px 6px;box-shadow:inset 0 0 0 1px var(--swline)}
.f-shoe{width:122px;display:flex;justify-content:space-between;margin-top:4px}
.f-shoe i{width:54px;height:16px;border-radius:9px 12px 4px 4px;box-shadow:inset 0 0 0 1px var(--swline)}
.f-shoe i:first-child{border-radius:12px 9px 4px 4px}
.items{list-style:none;display:flex;flex-direction:column;gap:14px}
.items li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.items .c{width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--swline);position:relative;overflow:hidden}
.items .c i{position:absolute;inset:0 0 0 50%}
.items .k{display:block;font-size:12px;color:var(--ink2)}
.items .v{display:block;font-size:15px;font-weight:600;line-height:1.25}
.items .h{display:block;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;justify-items:center}
.duo figure{display:flex;flex-direction:column;align-items:center;gap:10px}
.duo figcaption{font-size:13px;font-weight:650}
.duo .fig{transform:scale(.92);transform-origin:top center;margin-bottom:-24px}
.keep{margin-top:22px}
.sub{font-size:13px;color:var(--ink2);margin:24px 0 12px}
.unote{margin-top:10px;font-size:14px;color:var(--ink2);max-width:46ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-size:12.5px;font-weight:550;padding:5px 10px;border-radius:9px;background:var(--fill);color:var(--ink2)}
.tag.ojo{color:var(--ojo)}
.pista{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14px;color:var(--ink2);display:flex;gap:12px;align-items:center;justify-content:space-between}
.pista .chip{flex:none;color:var(--ink)}
@media (max-width:360px){.result{grid-template-columns:1fr}.fig{margin:0 auto}}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:26px;background:var(--ink);color:var(--bg);font-weight:650;font-size:16px;padding:0 20px}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.acento{background:var(--accent);color:#fff}
.btn.peligro{background:none;color:var(--ojo);border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
.btn svg{width:20px;height:20px}
.pila{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.note{margin-top:12px;font-size:13px;color:var(--ink2);text-align:center}

/* Barra de contexto (encima de las pestañas) */
.ctx{position:fixed;left:0;right:0;bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 18px}
.ctx .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:48px}
.ctx .hint{flex:1;font-size:13px;color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}
.mini-btn{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);font-size:15px;font-weight:600}
.mini-btn.ico{width:48px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.mini-btn.ico svg{width:22px;height:22px}
.mini-btn.ico[aria-pressed="true"]{color:var(--ojo);border-color:currentColor}
.mini-btn.ico[aria-pressed="true"] svg{fill:currentColor}
.ctx .btn{min-height:48px;flex:1}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabs)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink3)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--tinta-accent)}

/* Listas agrupadas */
.grupo{margin-top:26px}
.grupo>h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:600;color:var(--ink2);padding:0 4px 8px}
.grupo>h2 span{font-weight:500;font-variant-numeric:tabular-nums}
.caja{background:var(--surface);border-radius:16px;overflow:hidden}
.fila{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:56px;padding:8px 14px;position:relative}
.fila+.fila::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.fila.sin-ico{grid-template-columns:1fr auto}
.fila .abre{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;grid-column:1/3;min-height:40px}
.fila.sin-ico .abre{grid-template-columns:1fr;grid-column:1}
.cuad{width:34px;height:34px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--swline);position:relative;overflow:hidden;flex:none}
.cuad i{position:absolute;inset:0 0 0 50%}
.t1{display:block;font-size:16px;font-weight:550;line-height:1.25}
.t1 small{font-size:12px;color:var(--tinta-accent);margin-left:4px}
.t2{display:block;font-size:13px;color:var(--ink2);line-height:1.3;margin-top:1px}
.t2.ojo{color:var(--ojo)}
.valor{font-size:15px;color:var(--ink2);text-align:right;max-width:46vw}
.flecha{color:var(--ink3);font-size:20px;line-height:1}
.fila select{appearance:none;-webkit-appearance:none;background:var(--fill);border:0;border-radius:10px;padding:8px 12px;font-size:15px;max-width:44vw}
.fila.bloque{display:block;padding:12px 14px}
.fila.bloque .t2{margin-top:4px;font-size:14.5px;color:var(--ink)}

/* Interruptor */
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .18s;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.22);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--si)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.switch[disabled]{opacity:.4}

/* Inventario */
.resumen{background:var(--surface);border-radius:16px;padding:16px;margin-top:4px}
.resumen .num{font:700 22px/1.15 var(--redonda);letter-spacing:-.01em}
.prog{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:12px 0 10px}
.prog i{display:block;height:100%;background:var(--si);border-radius:4px}
.resumen p{font-size:14px;color:var(--ink2)}
.puntos{display:flex;gap:4px;flex-wrap:wrap}
.puntos i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--swline);opacity:.28}
.puntos i.si{opacity:1}

/* Favoritos */
.favs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.fav{background:var(--surface);border-radius:16px;padding:14px 12px 12px;text-align:left;display:block;width:100%}
.fav .lam{height:150px;display:flex;justify-content:center;align-items:flex-start;gap:12px;overflow:hidden}
.fav .lam .fig{flex:none;transform:scale(.5);transform-origin:top center;margin:0 -33px}
.fav .t1{font-size:15px;margin-top:8px}

/* Perfil */
.heroe{background:var(--surface);border-radius:16px;padding:18px 16px}
.heroe .est{font:700 22px/1.2 var(--redonda);letter-spacing:-.01em}
.heroe p{font-size:14.5px;color:var(--ink2);margin-top:8px}
.paleta{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 8px;padding:14px}
.paleta div{font-size:11.5px;line-height:1.25;color:var(--ink2);text-align:center}
.paleta b{display:block;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--swline);margin-bottom:5px;position:relative;overflow:hidden}
.paleta .no b::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--ojo) calc(50% - 1px),var(--ojo) calc(50% + 1px),transparent calc(50% + 1px))}
.colores{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.colores button{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--swline)}
.colores button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ring)}
details.caja summary{list-style:none;padding:14px;font-size:15px;font-weight:550;display:flex;justify-content:space-between;cursor:pointer}
details.caja summary::-webkit-details-marker{display:none}
details.caja ul{list-style:none;padding:0 14px 12px;font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
details.caja ul b{color:var(--ink);font-weight:600}

/* Vacíos */
.vacio{margin-top:26px;padding:22px 18px;border-radius:16px;background:var(--surface);font-size:15px;color:var(--ink2);line-height:1.45}
.vacio b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.vacio .btn{margin-top:14px}

/* Hoja inferior */
.velo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.38);animation:aparece .18s ease-out}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--bg);border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:sube .24s cubic-bezier(.2,.8,.2,1)}
.hoja .in{max-width:560px;margin:0 auto}
.hoja .asa{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.hoja .cab{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.hoja .cab h2{font:700 20px/1.2 var(--redonda);letter-spacing:-.01em}
.enlace{color:var(--tinta-accent);font-weight:600;font-size:16px;min-height:44px;padding:0 4px}
.campo{display:block;margin-top:16px}
.campo>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 4px 6px}
.campo input[type=text],.campo input[type=url],.campo textarea,.campo select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;appearance:none;-webkit-appearance:none}
.campo textarea{min-height:92px;resize:vertical}
.color-in{display:grid;grid-template-columns:52px 1fr;gap:10px}
.color-in input[type=color]{width:52px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px}
@keyframes sube{from{transform:translateY(100%)}to{transform:none}}
@keyframes aparece{from{opacity:0}to{opacity:1}}

/* Primera vez */
#setup{max-width:560px;margin:0 auto;padding:12vh 22px 40px}
#setup h1{font:700 32px/1.1 var(--redonda);letter-spacing:-.02em}
#setup p{margin-top:12px;font-size:16px;color:var(--ink2);line-height:1.45}
#setup .err{color:var(--ojo);font-size:14.5px;margin-top:12px;min-height:20px}
#setup ol{margin:18px 0 0 20px;font-size:14.5px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}

/* Aviso breve */
.toast{position:fixed;left:50%;bottom:calc(var(--tabs) + env(safe-area-inset-bottom,0px) + 84px);z-index:30;transform:translate(-50%,10px);
  max-width:min(88vw,460px);padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14.5px;font-weight:550;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.ver{opacity:1;transform:translate(-50%,0)}

.fade{animation:f .18s ease-out}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<noscript><style>#app,#setup{display:none!important}.nojs{max-width:520px;margin:28px auto;padding:18px;border:1px solid var(--line);border-radius:16px;font-size:15px;line-height:1.5;color:var(--ink2)}.nojs b{color:var(--ink)}</style></noscript>
</head>
<body>
<noscript><div class="nojs"><b>Abre esta página en Safari.</b><br>La vista previa del teléfono (Archivos, WhatsApp, correo) no ejecuta la app.</div></noscript>

<!-- Primera vez: pedir la URL del Apps Script -->
<section id="setup" hidden>
  <h1>Conecta tu hoja</h1>
  <p>Mi clóset guarda todo en tu Google Sheets. Pega la URL de implementación de tu Apps Script; se guarda en este teléfono y no se vuelve a pedir.</p>
  <label class="campo"><span>URL de la aplicación web</span>

<script>
'use strict';
/* ============================================================
   MI CLÓSET
   Este archivo solo trae interfaz y lógica. Todos los datos
   (prendas, combinaciones, reglas, perfil, favoritos) viven en
   Google Sheets y llegan por la API de Apps Script.

   1. Almacén local y API        4. Estado de la interfaz
   2. Motor de combinaciones     5. Pantallas
   3. Análisis de color          6. Acciones y arranque
   ============================================================ */

/* ============================================================
   1. ALMACÉN LOCAL Y API
   ============================================================ */
const K = { url: 'micloset.url', datos: 'micloset.datos', cola: 'micloset.cola' };
const ls = {
  get(k){ try { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const hexOk = h => /^#[0-9a-f]{6}$/i.test(String(h || ''));
const fill = c => c && hexOk(c.hex) ? `background:${c.hex}` : '';
const half = c => c && hexOk(c.hex2) ? `<i style="background:${c.hex2}"></i>` : '';
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const si = v => v === true || v === 'true' || v === 'TRUE';
const corto = n => String(n || '').split(' / ')[0].replace(/\s*\(.*?\)\s*/g, '').trim();

let API = ls.get(K.url);          // URL de implementación del Apps Script (se pide una sola vez)
let D = null;                     // última copia de los datos de Google Sheets
let cola = ls.get(K.cola) || [];  // cambios hechos en la app que aún no llegan a Google Sheets
let enVuelo = 0, enviando = false, cargando = false;

async function pedir(url, opciones){
  const ctl = new AbortController(), reloj = setTimeout(() => ctl.abort(), 25000);
  try {
    const r = await fetch(url, Object.assign({ redirect: 'follow', signal: ctl.signal }, opciones));
    const texto = await r.text();
    try { return JSON.parse(texto); } catch (e) { throw new Error('NO_JSON'); }
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('TIEMPO');
    if (e.message === 'NO_JSON') throw e;
    throw new Error('RED');
  } finally { clearTimeout(reloj); }
}
/* Google Sheets → app */
const apiLeer = (url, accion) => pedir(url + (url.indexOf('?') < 0 ? '?' : '&') + 'action=' + accion + '&t=' + Date.now(), { method: 'GET' });
/* App → Google Sheets. Se envía como text/plain para que el navegador no haga la consulta previa (preflight) que Apps Script no contesta. */
const apiEscribir = cuerpo => pedir(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) });

const ERRORES = {
  NO_JSON: 'La URL respondió, pero no como la API de Mi clóset. Revisa que termine en /exec y que el acceso sea «Cualquier usuario».',
  RED: 'No se pudo conectar. Revisa tu conexión a internet.',
  TIEMPO: 'Google tardó demasiado en responder. Intenta de nuevo.'
};
const textoError = e => ERRORES[e && e.message] || ('Google Sheets respondió: ' + ((e && e.message) || 'error desconocido'));
const datosValidos = d => !!d && d.ok === true && ['categorias', 'prendas', 'combinaciones', 'reglas', 'perfil'].every(k => Array.isArray(d[k]));
const guardar = () => ls.set(K.datos, D);

function usarDatos(d){
  d.evitar = d.evitar || []; d.favoritos = d.favoritos || []; d.cuando = Date.now();
  D = d; guardar(); construir(); az.listo = false; revalidar();
}

/* Cada cambio se aplica al instante en pantalla y se manda a Google Sheets.
   Si no hay señal, se queda en la cola (guardada en el teléfono) y se reintenta. */
function encolar(op){
  const ult = cola.length > enVuelo ? cola[cola.length - 1] : null;
  if (ult && op.action === 'prenda.update' && ult.action === op.action && ult.id === op.id) Object.assign(ult.cambios, op.cambios);
  else if (ult && op.action === 'perfil.set' && ult.action === op.action && ult.clave === op.clave) ult.valor = op.valor;
  else cola.push(op);
  ls.set(K.cola, cola); guardar(); vaciar();
}
async function vaciar(){
  if (enviando || !cola.length || !API) { pintarSync(); return !cola.length; }
  enviando = true; enVuelo = cola.length; pintarSync();
  const lote = cola.slice(0, enVuelo);
  let ok = false;
  try {
    const r = await apiEscribir(lote.length === 1 ? lote[0] : { action: 'batch', ops: lote });
    if (!r || r.ok !== true) throw new Error((r && r.error) || 'RESPUESTA');
    cola = cola.slice(lote.length); ls.set(K.cola, cola); ok = true;
    const rechazo = (r.resultados || []).find(x => !x.ok);
    if (rechazo) toast('Google Sheets rechazó un cambio: ' + rechazo.error + ' Pulsa Actualizar.', 6000);
  } catch (e) { /* se queda en la cola */ }
  enviando = false; enVuelo = 0;
  if (ok && cola.length) return vaciar();
  pintarSync(); return ok;
}
/* Botón «Actualizar datos»: primero sube lo pendiente, luego trae todo de Google Sheets. */
async function actualizar(){
  if (cargando) return;
  cargando = true; pintarSync();
  try {
    await vaciar();
    if (cola.length) { toast('Hay ' + plural(cola.length, 'cambio que no se pudo enviar', 'cambios que no se pudieron enviar') + '. Siguen guardados en el teléfono; intenta con mejor señal.', 5000); return; }
    const d = await apiLeer(API, 'load');
    if (!datosValidos(d)) throw new Error((d && d.error) || 'NO_JSON');
    usarDatos(d); cargando = false; render(); toast('Datos actualizados');
  } catch (e) { toast(textoError(e), 5000); }
  finally { cargando = false; pintarSync(); }
}

/* ============================================================
   2. MOTOR DE COMBINACIONES
   Es el del HTML original: tres conjuntos de outfits reales.
     PERSONAL   = combinaciones de tu análisis
     TRABAJO    = playera de uniforme + base que armoniza con ella
     COMBINADOS = misma base válida para la playera de trabajo
                  y para la de cambio a la vez
   Lo nuevo: se arma con las hojas de Google Sheets y después se
   filtra por inventario.
   ============================================================ */
const SIN_CAPA = 'sin-capa';
const CAMPOS = ['trabajo', 'superior', 'pantalon', 'zapatos', 'cinturon', 'capa', 'accesorios'];
const BASE_KEYS = ['pantalon', 'zapatos', 'cinturon', 'capa', 'accesorios'];
let pref = {}, CAT = {}, FUENTE = {}, IDX = {}, PID = {}, R = {};
let TODOS = { personal: [], trabajo: [], combinados: [] }, PERSONAL = [], TRABAJO = [], COMBINADOS = [], avisos = [];

const baseKey = o => BASE_KEYS.map(k => o[k]).join('|');
const clave = o => CAMPOS.map(k => o[k] || '').join('|');
function unicos(lista){ const visto = new Set(), out = []; for (const o of lista){ const k = clave(o); if (!visto.has(k)){ visto.add(k); out.push(o); } } return out; }

function construir(){
  avisos = [];
  pref = {}; D.perfil.forEach(r => { pref[r.clave] = r.valor; });
  CAT = {}; D.categorias.forEach(c => { c.usa_inventario = c.usa_inventario !== false && c.usa_inventario !== 'FALSE'; CAT[c.clave] = c; });
  FUENTE = {}; IDX = {}; PID = {}; CAMPOS.forEach(k => { FUENTE[k] = []; IDX[k] = {}; });
  D.prendas.forEach((p, i) => {
    p.ord = i; p.tengo = si(p.tengo); p.disponible = !(p.disponible === false || p.disponible === 'FALSE');
    if (!FUENTE[p.categoria]) { avisos.push(`Prendas: «${p.id}» tiene una categoría que no existe (${p.categoria}).`); return; }
    if (PID[p.id]) { avisos.push(`Prendas: el id «${p.id}» está repetido; se usa el primero.`); return; }
    FUENTE[p.categoria].push(p); IDX[p.categoria][p.id] = p; PID[p.id] = p;
  });
  const sinCapa = { id: SIN_CAPA, categoria: 'capa', nombre: 'Sin capa', hex: '', nota: 'Sin chamarra, suéter ni sobrecamisa.', ord: 1e6, fija: true };
  FUENTE.capa.push(sinCapa); IDX.capa[SIN_CAPA] = sinCapa;

  /* Hoja Reglas: pares «si → entonces» */
  R = { cinturon: {}, acc: {}, uniPant: {}, uniCapa: {}, invisibles: {} };
  const TIPOS = { cinturon_por_zapato: ['cinturon', 'zapatos', 'cinturon'], accesorios_por_cinturon: ['acc', 'cinturon', 'accesorios'],
                  uniforme_pantalon: ['uniPant', 'trabajo', 'pantalon'], uniforme_capa: ['uniCapa', 'trabajo', 'capa'] };
  D.reglas.forEach((r, i) => {
    if (r.tipo === 'calcetines_invisibles') { R.invisibles[r.si] = true; return; }
    const t = TIPOS[r.tipo];
    if (!t) { avisos.push(`Reglas, fila ${i + 2}: tipo desconocido «${r.tipo}».`); return; }
    if ((r.si !== '*' && !IDX[t[1]][r.si]) || !IDX[t[2]][r.entonces]) { avisos.push(`Reglas, fila ${i + 2}: «${r.si}» o «${r.entonces}» no existe en Prendas.`); return; }
    (R[t[0]][r.si] ||= []).push(r.entonces);
  });
  const accPara = b => R.acc[b] || R.acc['*'] || [];

  /* Hoja Combinaciones */
  const combos = D.combinaciones.map((c, i) => {
    if (c.activa === false || c.activa === 'FALSE') return null;
    const zap = [c.zapato_1, c.zapato_2].filter(Boolean);
    const mal = [['superior', c.superior], ['pantalon', c.pantalon], ['capa', c.capa]].concat(zap.map(z => ['zapatos', z])).filter(([k, id]) => id && !IDX[k][id]);
    if (!c.superior || !c.pantalon || !zap.length || mal.length) {
      avisos.push(`Combinaciones, fila ${i + 2}: ` + (mal.length ? `«${mal[0][1]}» no existe en Prendas.` : 'falta superior, pantalón o zapato.'));
      return null;
    }
    return { superior: c.superior, pantalon: c.pantalon, zapatos: zap, capa: c.capa || null };
  }).filter(Boolean);

  const personal = unicos(combos.flatMap(c => c.zapatos.flatMap(z => (R.cinturon[z] || []).flatMap(b => accPara(b).flatMap(a =>
    (c.capa ? [c.capa, SIN_CAPA] : [SIN_CAPA]).map(k => ({ trabajo: null, superior: c.superior, pantalon: c.pantalon, zapatos: z, cinturon: b, capa: k, accesorios: a })))))));

  /* Lo que el análisis dice que va con cada pantalón */
  const ZAP = {}, CAPA = {};
  combos.forEach(c => { (ZAP[c.pantalon] ||= new Set()); c.zapatos.forEach(z => ZAP[c.pantalon].add(z)); (CAPA[c.pantalon] ||= new Set()); if (c.capa) CAPA[c.pantalon].add(c.capa); });
  const trabajo = unicos(FUENTE.trabajo.flatMap(u => (R.uniPant[u.id] || []).flatMap(p => [...(ZAP[p] || [])].flatMap(z => (R.cinturon[z] || []).flatMap(b => accPara(b).flatMap(a =>
    [...(R.uniCapa[u.id] || []).filter(k => CAPA[p] && CAPA[p].has(k)), SIN_CAPA].map(k => ({ trabajo: u.id, superior: null, pantalon: p, zapatos: z, cinturon: b, capa: k, accesorios: a }))))))));

  const porBase = {};
  personal.forEach(o => (porBase[baseKey(o)] ||= []).push(o.superior));
  const combinados = trabajo.flatMap(t => (porBase[baseKey(t)] || []).map(s => Object.assign({}, t, { superior: s })));

  TODOS = { personal, trabajo, combinados };
  aplicarInventario(); aplicarColor();
}

/* Inventario: «tengo» + «disponible» deciden qué entra a los outfits */
const controla = k => !!CAT[k] && CAT[k].usa_inventario !== false;
const laTengo = (k, id) => !id || id === SIN_CAPA || !controla(k) || !!(IDX[k][id] && IDX[k][id].tengo && IDX[k][id].disponible);
const hay = (k, id) => !si(pref.solo_inventario) || laTengo(k, id);
const estricto = o => CAMPOS.every(k => laTengo(k, o[k]));
function aplicarInventario(){
  const ok = o => CAMPOS.every(k => hay(k, o[k]));
  PERSONAL = TODOS.personal.filter(ok); TRABAJO = TODOS.trabajo.filter(ok); COMBINADOS = TODOS.combinados.filter(ok);
}

/* ============================================================
   3. ANÁLISIS DE COLOR EN LA LÓGICA
   - Contraste: diferencia de luminosidad (L* de CIELAB) entre la
     prenda de arriba y el pantalón (o la capa, si contrasta más),
     comparada con tu contraste personal (Perfil → contraste).
   - Nivel: los colores estrella pesan más en el azar.
   ============================================================ */
const memoLuz = {};
function luz(hex){
  if (memoLuz[hex] != null) return memoLuz[hex];
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4));
  const y = r * .2126 + g * .7152 + b * .0722;
  return (memoLuz[hex] = 116 * (y > .008856 ? Math.cbrt(y) : 7.787 * y + 16 / 116) - 16);
}
const NIV_CONTRASTE = ['Bajo', 'Medio', 'Medio-alto', 'Alto'];
const metaContraste = () => { const i = NIV_CONTRASTE.indexOf(String(pref.contraste || '')); return i < 0 ? 2 : i; };
function contraste(o, cat){
  const t = IDX[cat][o[cat]], p = IDX.pantalon[o.pantalon], k = o.capa && o.capa !== SIN_CAPA ? IDX.capa[o.capa] : null;
  if (!t || !p || !hexOk(t.hex) || !hexOk(p.hex)) return null;
  let d = Math.abs(luz(t.hex) - luz(p.hex));
  if (k && hexOk(k.hex)) d = Math.max(d, Math.abs(luz(t.hex) - luz(k.hex)));
  const i = d < 18 ? 0 : d < 38 ? 1 : d < 58 ? 2 : 3;
  return { d, i, nombre: NIV_CONTRASTE[i], dist: Math.abs(i - metaContraste()) };
}
function peso(o, m){
  let w = 1;
  if (si(pref.azar_nivel)) {
    const n = o.superior && IDX.superior[o.superior] ? Number(IDX.superior[o.superior].nivel) || 0 : 0;
    w *= n >= 5 ? 3 : n === 4 ? 2 : n === 3 ? 1.2 : 1.5;
    const k = o.capa !== SIN_CAPA ? IDX.capa[o.capa] : null;
    if (k && Number(k.nivel) >= 5) w *= 1.25;
  }
  if (si(pref.azar_contraste)) { const c = contraste(o, m === 'trabajo' ? 'trabajo' : 'superior'); if (c) w *= [1.6, 1.25, .85, .6][c.dist]; }
  return w;
}
function elegirConPeso(lista, m){
  const pesos = lista.map(o => peso(o, m));
  let r = Math.random() * pesos.reduce((a, b) => a + b, 0);
  for (let j = 0; j < lista.length; j++) { r -= pesos[j]; if (r <= 0) return lista[j]; }
  return lista[lista.length - 1];
}
/* Si el outfit va sin capa y queda por debajo de tu contraste, busca la capa compatible que más lo sube. */
function sugerenciaCapa(o){
  if (o.capa !== SIN_CAPA) return null;
  const cat = modo === 'trabajo' ? 'trabajo' : 'superior', base = contraste(o, cat);
  if (!base || base.i >= metaContraste()) return null;
  let mejor = null;
  conjunto(o).forEach(x => {
    if (x.capa === SIN_CAPA || !CAMPOS.every(k => k === 'capa' || (x[k] || null) === (o[k] || null))) return;
    const c = contraste(x, cat);
    if (c && c.i > base.i && (!mejor || c.d > mejor.c.d)) mejor = { capa: IDX.capa[x.capa], c };
  });
  return mejor;
}
function mezclar(a, b, t){
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function aplicarColor(){
  const h = hexOk(pref.color_app) ? pref.color_app : '#1F5560', st = document.documentElement.style;
  st.setProperty('--accent', h); st.setProperty('--accent-claro', mezclar(h, '#FFFFFF', .52));
}

/* ============================================================
   4. ESTADO DE LA INTERFAZ
   ============================================================ */
let tab = 'armar';
let modo = 'normal';        // 'normal' | 'trabajo'
let sel = {};               // {categoria: id}
let orden = [];             // orden en que se eligieron (para revalidar)
let sinCambio = false;      // decidió no usar playera de cambio
let vista = null;           // categoría abierta o 'final'
let historial = [];
let az = { modo: 'normal', playera: '', cambio: true, capa: 'Indistinto', actual: null, recientes: [], total: 0, nota: '', listo: false };
let invVista = 'categoria';

function cats(){
  const base = D.categorias.filter(c => FUENTE[c.clave]).map(c => ({ key: c.clave, label: c.nombre, q: c.pregunta, n: [c.singular, c.plural] }));
  if (modo === 'normal') return base.filter(c => c.key !== 'trabajo');
  return base.map(c => c.key === 'superior' ? Object.assign({}, c, { label: 'Cambio', q: '¿A qué playera te cambias después?', n: ['playera de cambio', 'playeras de cambio'], opcional: true }) : c);
}
const conjunto = s => modo === 'normal' ? PERSONAL : (s.superior ? COMBINADOS : TRABAJO);
const conjuntoTodo = s => modo === 'normal' ? TODOS.personal : (s.superior ? TODOS.combinados : TODOS.trabajo);
const coincide = (o, s) => { for (const k in s) if (s[k] != null && o[k] !== s[k]) return false; return true; };
const filtrar = s => conjunto(s).filter(o => coincide(o, s));
const total = () => filtrar(sel).length;
const completo = () => cats().every(c => c.opcional || sel[c.key]);
const sinOutfits = () => !(modo === 'normal' ? PERSONAL : TRABAJO).length;
const primeraObligatoria = () => { const c = cats().find(c => !sel[c.key] && !c.opcional); return c ? c.key : 'final'; };
const nOut = n => plural(n, 'outfit posible', 'outfits posibles');
const outfitDeSel = () => { const o = {}; CAMPOS.forEach(k => { o[k] = sel[k] || null; }); return o; };
const subir = () => window.scrollTo(0, 0);

function opciones(k){
  const otras = Object.assign({}, sel); delete otras[k];
  const esCambio = modo === 'trabajo' && k === 'superior';
  const pool = esCambio ? COMBINADOS.filter(o => coincide(o, otras)) : filtrar(otras);
  const poolTodo = (esCambio ? TODOS.combinados : conjuntoTodo(otras)).filter(o => coincide(o, otras));
  const cuenta = {}, cuentaTodo = {};
  pool.forEach(o => { cuenta[o[k]] = 1; }); poolTodo.forEach(o => { cuentaTodo[o[k]] = 1; });
  const motivo = c => !cuentaTodo[c.id] ? 'No combina' : !laTengo(k, c.id) ? (c.tengo ? 'No disponible' : 'No la tienes') : 'Falta con qué usarla';
  const lista = FUENTE[k].map(c => ({ c, ok: !!cuenta[c.id], motivo: cuenta[c.id] ? '' : motivo(c) }));
  const prio = k === 'superior' ? (a, b) => ((Number(b.c.nivel) || 0) - (Number(a.c.nivel) || 0)) || (a.c.ord - b.c.ord) : (a, b) => a.c.ord - b.c.ord;
  lista.sort((a, b) => (b.ok - a.ok) || prio(a, b));
  return { lista, disponibles: lista.filter(x => x.ok).length, hayOtras: Object.keys(otras).length > 0 };
}
function siguiente(desde){
  const cs = cats(), i0 = cs.findIndex(c => c.key === desde);
  for (let s = 1; s <= cs.length; s++){
    const c = cs[(i0 + s + cs.length) % cs.length];
    if (!sel[c.key] && !(c.opcional && sinCambio)) return c.key;
  }
  return 'final';
}
function ir(v, push = true){ if (push && vista && vista !== v) historial.push(vista); vista = v; render(); subir(); }
function elegir(k, id){
  if (sel[k] === id) { delete sel[k]; orden = orden.filter(x => x !== k); render(); return; }
  sel[k] = id; orden = orden.filter(x => x !== k); orden.push(k);
  if (k === 'superior') sinCambio = false;
  const nx = siguiente(k);
  ir(nx === 'final' && !completo() ? primeraObligatoria() : nx);
}
/* Conserva lo elegido que siga siendo compatible, en el orden en que se eligió.

function revalidar(){

    if (sel[k] == null || validas.indexOf(k) < 0 || !IDX[k][sel[k]]) continue;
    nuevo[k] = sel[k]; if (!filtrar(nuevo).length) delete nuevo[k];
  }
  sel = nuevo; orden = orden.filter(k => sel[k] != null); historial = [];
  if (!sel.superior && modo === 'normal') sinCambio = false;
  if (!vista || vista === 'final' || validas.indexOf(vista) < 0) { const c = cats().find(c => !sel[c.key] && !(c.opcional && sinCambio)); vista = c ? c.key : 'final'; }
}
function cambiarModo(m){
  if (m === modo) return;
  modo = m; if (m === 'normal') { delete sel.trabajo; sinCambio = false; }

}
function reiniciar(){ sel = {}; orden = []; sinCambio = false; historial = []; vista = cats()[0].key; render(); subir(); }
function abrirEnArmar(m, o){

  sinCambio = m === 'trabajo' && !o.superior; vista = 'final'; revalidar();

/* Al azar */
const claveVisual = o => [o.trabajo, o.superior, o.pantalon, o.zapatos, o.capa].join('|');
function sortear(){
  const m = az.modo; let nota = '';
  let pool = m === 'normal' ? PERSONAL : (az.cambio ? COMBINADOS : TRABAJO);
  if (m === 'trabajo' && az.playera) pool = pool.filter(o => o.trabajo === az.playera);
  if (m === 'trabajo' && az.cambio && !pool.length) {
    pool = TRABAJO.filter(o => !az.playera || o.trabajo === az.playera);
    if (pool.length) nota = 'No hay playera de cambio que comparta toda la base; va solo el outfit de trabajo.';
  }
  if (az.capa !== 'Indistinto') {
    const f = pool.filter(o => az.capa === 'Con capa' ? o.capa !== SIN_CAPA : o.capa === SIN_CAPA);
    if (f.length) pool = f; else if (pool.length) nota = 'No hay opción ' + az.capa.toLowerCase() + ' para esta selección; se muestra otra.';
  }
  az.total = pool.length; az.nota = nota;
  if (!pool.length) { az.actual = null; return; }
  const frescos = pool.filter(o => az.recientes.indexOf(claveVisual(o)) < 0);
  az.actual = elegirConPeso(frescos.length ? frescos : pool, m);
  az.recientes.push(claveVisual(az.actual)); if (az.recientes.length > 12) az.recientes.shift();
}

/* Qué conviene conseguir: cuántos outfits completos abre cada prenda que falta */
function faltantes(){
  const uso = {}, abre = {};
  for (const o of TODOS.personal.concat(TODOS.trabajo)) {
    const falta = [];
    for (const k of CAMPOS) { const id = o[k]; if (!id || id === SIN_CAPA) continue; uso[id] = (uso[id] || 0) + 1; if (!laTengo(k, id)) falta.push(id); }

}

async function conectar(){
  const url = $('setup-url').value.trim(), err = $('setup-err'), b = $('setup-ok');
  if (!/^https?:\/\/\S+$/.test(url)) { err.textContent = 'Pega la URL completa. Empieza con https://script.google.com/'; return; }
  if (/docs\.google\.com|\/edit(\?|#|$)/.test(url)) { err.textContent = 'Esa es la dirección de la hoja o del editor. Necesitas la URL de la aplicación web, la que termina en /exec.'; return; }
  if (/\/dev(\?|$)/.test(url)) { err.textContent = 'La URL de prueba (/dev) solo funciona con tu sesión de Google. Usa la que termina en /exec.'; return; }
  b.disabled = true; b.textContent = 'Conectando'; err.textContent = '';
  try {
    const d = await apiLeer(url, 'load');
    if (!datosValidos(d)) throw new Error((d && d.error) || 'NO_JSON');
    if (url !== API) { cola = []; ls.set(K.cola, cola); }
    API = url; ls.set(K.url, API); usarDatos(d); preferenciasIniciales(); revalidar(); mostrarApp();
  } catch (e) {
    /* Si la implementación no es pública, Google responde con su página de inicio de sesión y el navegador la bloquea: se ve como falla de red. */
    err.textContent = e.message === 'RED' ? 'No se pudo leer esa URL. Revisa tu conexión y que la implementación tenga acceso «Cualquier usuario».' : textoError(e);
  }
  finally { b.disabled = false; b.textContent = 'Conectar'; }
}

   ============================================================ */
const encender = (el, on) => el.setAttribute('aria-checked', String(!!on));
const luego = fn => setTimeout(fn, 200);   // deja ver la animación del interruptor antes de redibujar

const ACC = {
  tab(el){ tab = el.dataset.v; render(); subir(); },
  actualizar(){ actualizar(); },
  cerrar(){ cerrarHoja(); },
  seg(el){
    const n = el.dataset.n, v = el.dataset.v;
    if (n === 'modo') cambiarModo(v);
    else if (n === 'azmodo') { az.modo = v; sortear(); render(); }
    else if (n === 'inv') { invVista = v; render(); }
    else if (n === 'f-nivel') el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
  },
  /* Armar */
  ir(el){ ir(el.dataset.k); },
  elegir(el){ elegir(vista, el.dataset.id); },
  quitar(el){ delete sel[el.dataset.k]; orden = orden.filter(x => x !== el.dataset.k); render(); },
  'sin-cambio'(){ sinCambio = true; delete sel.superior; orden = orden.filter(x => x !== 'superior'); const nx = siguiente('superior'); ir(nx === 'final' && !completo() ? primeraObligatoria() : nx); },
  'agregar-cambio'(){ sinCambio = false; ir('superior'); },
  completar(){
    let pool = filtrar(sel);
    if (modo === 'trabajo' && !sel.superior && !sinCambio && si(pref.trabajo_con_cambio)) { const c = COMBINADOS.filter(o => coincide(o, sel)); if (c.length) pool = c; }
    if (!pool.length) return;
    const o = elegirConPeso(pool, modo);
    cats().forEach(c => { if (o[c.key] && sel[c.key] !== o[c.key]) { sel[c.key] = o[c.key]; orden = orden.filter(x => x !== c.key); orden.push(c.key); } });
    if (modo === 'trabajo' && !sel.superior) sinCambio = true;
    ir('final');
  },
  'poner-capa'(el){ sel.capa = el.dataset.id; orden = orden.filter(x => x !== 'capa'); orden.push('capa'); render(); },
  atras(){ if (historial.length) { vista = historial.pop(); render(); subir(); } },
  reiniciar(){ reiniciar(); },
  favorito(){ alternarFav(modo, outfitDeSel()); render(); },
  'paleta-completa'(){ ponerPref('solo_inventario', false); render(); },
  /* Al azar */
  'az-otro'(){ sortear(); render(); subir(); },
  'az-playera'(el){ az.playera = el.dataset.id; sortear(); render(); },
  'az-cambio'(el){ az.cambio = !az.cambio; encender(el, az.cambio); sortear(); luego(render); },
  'az-fav'(){ if (az.actual) { alternarFav(az.modo, az.actual); render(); } },
  'az-ajustar'(){ if (az.actual) abrirEnArmar(az.modo, az.actual); },
  /* Favoritos */
  'ver-fav'(el){ hojaFavorito(el.dataset.id); },
  'guardar-fav'(el){
    const f = D.favoritos.find(x => String(x.id) === el.dataset.id); if (!f) return;
    const cambios = {}, nombre = $('f-nombre').value.trim(), nota = $('f-nota').value.trim();
    if (nombre !== (f.nombre || '')) cambios.nombre = nombre;
    if (nota !== (f.nota || '')) cambios.nota = nota;
    if (Object.keys(cambios).length) { Object.assign(f, cambios); encolar({ action: 'favorito.update', id: f.id, cambios }); }
    cerrarHoja(); render();
  },
  'fav-armar'(el){ const f = D.favoritos.find(x => String(x.id) === el.dataset.id); if (f) abrirEnArmar(modoDeFav(f), outfitDeFav(f)); },
  'fav-borrar'(el){
    const f = D.favoritos.find(x => String(x.id) === el.dataset.id); if (!f || !confirm('¿Quitar «' + (f.nombre || 'este outfit') + '» de favoritos?')) return;
    D.favoritos = D.favoritos.filter(x => x !== f); encolar({ action: 'favorito.delete', id: f.id }); cerrarHoja(); render(); toast('Quitado de favoritos');
  },
  /* Inventario */
  tengo(el){ const p = PID[el.dataset.id]; if (!p) return; cambiarPrenda(p, { tengo: !p.tengo }); encender(el, p.tengo); luego(render); },
  editar(el){ hojaPrenda(el.dataset.id); },
  'f-sw'(el){ encender(el, el.getAttribute('aria-checked') !== 'true'); },
  'guardar-prenda'(el){
    const p = PID[el.dataset.id]; if (!p) return;
    const cambios = {}, pon = (campo, v) => { if (v !== (p[campo] == null ? '' : p[campo])) cambios[campo] = v; };
    const hex = $('f-hex').value.trim().toUpperCase(), hex2 = $('f-hex2') ? $('f-hex2').value.trim().toUpperCase() : null;
    if ((hex && !hexOk(hex)) || (hex2 && !hexOk(hex2))) { toast('El color va en formato HEX, por ejemplo #1F5560'); return; }
    const nombre = $('f-nombre').value.trim(); if (!nombre) { toast('La prenda necesita un nombre'); return; }
    pon('nombre', nombre); pon('hex', hex); if (hex2 !== null) pon('hex2', hex2);
    pon('familia', $('f-familia').value); pon('nota', $('f-nota').value.trim());
    pon('tengo', $('f-tengo').getAttribute('aria-checked') === 'true'); pon('disponible', $('f-disp').getAttribute('aria-checked') === 'true');
    const niv = document.querySelector('#hoja [data-n="f-nivel"][aria-pressed="true"]');
    if (niv) { const n = niv.dataset.v === '' ? '' : Number(niv.dataset.v); if (n !== (p.nivel === '' || p.nivel == null ? '' : Number(p.nivel))) cambios.nivel = n; }
    if (Object.keys(cambios).length) cambiarPrenda(p, cambios);
    cerrarHoja(); render();
  },
  /* Perfil */
  'pref-sw'(el){ const k = el.dataset.k, v = !si(pref[k]); ponerPref(k, v); encender(el, v); luego(render); },
  'cat-inv'(el){
    const c = CAT[el.dataset.k]; if (!c) return;
    c.usa_inventario = !c.usa_inventario; encolar({ action: 'categoria.update', clave: c.clave, cambios: { usa_inventario: c.usa_inventario } });
    aplicarInventario(); az.listo = false; revalidar(); encender(el, c.usa_inventario);
  },
  'color-app'(el){ ponerPref('color_app', el.dataset.v); render(); },
  'editar-perfil'(el){ hojaTexto(el.dataset.k); },
  'guardar-texto'(el){ const v = $('f-texto').value.trim(); if (v !== String(pref[el.dataset.k])) ponerPref(el.dataset.k, v); cerrarHoja(); render(); },
  'cambiar-url'(){ mostrarSetup(true); }
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); subir(); return; }
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACC[el.dataset.a]; if (fn) fn(el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-c]'); if (!el) return;
  if (el.dataset.c === 'perfil') { ponerPref(el.dataset.k, el.value); render(); }
  if (el.dataset.c === 'az-capa') { az.capa = el.value; sortear(); render(); }
});
/* El selector de color y la caja de texto HEX se mantienen iguales */
document.addEventListener('input', e => {
  const el = e.target, par = el.dataset && el.dataset.par ? $(el.dataset.par) : null; if (!par) return;
  if (el.type === 'color') par.value = el.value.toUpperCase(); else if (hexOk(el.value.trim())) par.value = el.value.trim().toLowerCase();
});
$('velo').addEventListener('click', cerrarHoja);
$('setup-ok').addEventListener('click', conectar);
$('setup-url').addEventListener('keydown', e => { if (e.key === 'Enter') conectar(); });
$('setup-cancel').addEventListener('click', mostrarApp);
/* Reintenta lo pendiente al recuperar señal o al volver a la app */
window.addEventListener('online', vaciar);
document.addEventListener('visibilitychange', () => { if (!document.hidden) vaciar(); });

/* Arranque: muestra la última copia guardada en el teléfono. Los datos nuevos de la hoja llegan con «Actualizar». */
(function arrancar(){
  if (!API) { mostrarSetup(false); return; }
  const copia = ls.get(K.datos);
  if (datosValidos(copia)) { D = copia; construir(); preferenciasIniciales(); revalidar(); mostrarApp(); vaciar(); return; }
  $('setup').hidden = true; $('app').hidden = false;
  $('pantalla').innerHTML = '<div class="vacio" style="margin-top:20vh"><b>Cargando tu clóset</b>Leyendo los datos de Google Sheets.</div>';
  apiLeer(API, 'load').then(d => { if (!datosValidos(d)) throw new Error((d && d.error) || 'NO_JSON'); usarDatos(d); preferenciasIniciales(); revalidar(); render(); })
    .catch(e => { mostrarSetup(false); $('setup-err').textContent = textoError(e); });
})();
</script>
</body>
</html>
